  auth:
    container_name: auth
    build:
      context: ./server/services/auth
    ports:
      - "3001:3001"
    volumes:
      - ./server/services/auth:/app
    env_file:
      - ./.env
    environment:
      CLIENT_ID: ${CLIENT_ID}
      CLIENT_SECRET: ${CLIENT_SECRET}
      REDIRECT_URI: ${REDIRECT_URI}
      CHOKIDAR_USEPOLLING: true

  webapp:
    container_name: webapp
    build:
      context: ./webapp
    ports:
      - "5173:5173"
    volumes:
      - ./webapp:/webapp
    environment:
      VITE_BACKEND_ULR: http://localhost:3001

